# Rebuilds assets/dict/dictionary.db.gz from the upstream sources, including
# the Wiktionary data for French, Japanese and Korean, and commits it to the
# branch the workflow runs on.
name: Build dictionary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_dictionary.py --wiktionary
      - name: Commit dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dict/dictionary.db.gz
          git diff --cached --quiet || git commit -m "Rebuild offline dictionary"
          git push
