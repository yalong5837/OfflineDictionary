      <path d="M232 220 h380 a72 72 0 0 1 72 72 v240 a72 72 0 0 1 -72 72 h-236 l-96 84 v-84 h-48 a72 72 0 0 1 -72 -72 v-240 a72 72 0 0 1 72 -72 z" fill="#FFFFFF"/>
