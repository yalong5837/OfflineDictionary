<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: two speech bubbles, Chinese "文" and Latin "A". Rendered by tools/render_icon.mjs. -->
  <defs>
