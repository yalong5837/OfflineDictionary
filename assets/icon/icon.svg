      <path d="M492 440 h300 a72 72 0 0 1 72 72 v220 a72 72 0 0 1 -72 72 h-40 v80 l-92 -80 h-168 a72 72 0 0 1 -72 -72 v-220 a72 72 0 0 1 72 -72 z" fill="#FBBF24"/>
      <text x="642" y="730" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="270" font-weight="700" fill="#134E4A">A</text>
    </g>
  </g>
  </g>
</svg>
